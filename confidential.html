    <script>
        function checkPasscode() {
            const passcode = document.getElementById('passcodeBox').value;
            const confidentialSection = document.getElementById('confidential');
            if(passcode === '111222') { 
                confidentialSection.style.display = 'block';
            } else {
                alert('wrong.');
                confidentialSection.style.display = 'none';
            }
        }
    </script>
