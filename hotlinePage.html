<!DOCTYPE html>
<html lang="en">
<head> <!----all meta stuff outside of the main experience --->

<style>
               body{
            margin: 0;
            text-align: center;
            background: black;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            }
       
       /* Container to style and center your game canvas */
        .game-container {
            width: 100%;
            max-width: 900px; /* Match your GameMaker game's target resolution */
            height: 768px;    /* Match your GameMaker game's target resolution */
            margin: 0 auto;
            border: 2px solid #333;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        /* Makes the iframe responsive inside the container */
        .game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* */
        }
    </style>
</head>
<body>

    <!-- Link back to the homepage -->
    <p><a href="index.html">back.</a></p>
    <!-- Game Embedding Section -->
    <div class="game-container">
        <!-- Adjust the src path to point to your exported game's index file -->
        <iframe src="hotline/index.html" allowfullscreen></iframe>
    </div>

<!-- audio bypass  -->
    <script>
        window.addEventListener('click', function unlockIOSAudio() {
            const silentAudio = new Audio();
            silentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
            silentAudio.loop = true;
            silentAudio.play()
                .then(() => console.log("iOS silent switch successfully bypassed."))
                .catch(err => console.log("Audio bypass failed:", err));
            
            window.removeEventListener('click', unlockIOSAudio);
        }, { once: true });
    </script>

</body>
